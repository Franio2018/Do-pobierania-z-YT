<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 Segoe UI, sans-serif; width: 260px; margin: 12px; }
    p { margin: 0 0 8px; }
    button { width: 100%; padding: 8px; margin-top: 6px; cursor: pointer; }
    .muted { color: #555; }
  </style>
</head>
<body>
  <p><strong>MusicDownload listens</strong></p>
  <p id="status" class="muted">Loading...</p>
  <button id="export">Export JSON</button>
  <p class="muted">Watches 80%+ of a YouTube video. If the desktop app is closed, listens are saved automatically and imported when you open it. Export JSON is only a backup.</p>
  <script src="popup.js"></script>
</body>
</html>
